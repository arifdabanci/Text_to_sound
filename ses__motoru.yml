name: RoboAI Ses Stüdyosu

on:
  workflow_dispatch:

jobs:
  ses_olustur:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları depodan çek
        uses: actions/checkout@v3

      - name: Python'u hazırla
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri yükle
        run: pip install requests

      - name: ElevenLabs ile MP3 Üret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python ses_uret.py

      - name: MP3 Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Gercek_Insan_Sesi_Vokal
          path: gercek_vokal.mp3
